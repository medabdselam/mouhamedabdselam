/* ------------------------------------------------------------------
   محرّك عرض صغير يُشغّل قالب الموقع (sc-for / sc-if / {{ }} / onClick /
   style-hover) بدون أي مكتبة خارجية. مكتوب ليطابق سلوك محرّر التصميم.
------------------------------------------------------------------ */
(function () {
  'use strict';

  var TPL = null;
  var ROOT = null;

  function resolve(path, scope) {
    path = String(path == null ? '' : path).trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === '') return undefined;
    var parts = path.split('.');
    var cur = scope;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function interp(str, scope) {
    return str.replace(/\{\{([^}]*)\}\}/g, function (_, expr) {
      var v = resolve(expr, scope);
      return v == null ? '' : String(v);
    });
  }

  // القيمة الخام حين يكون النص عبارة عن {{ ... }} فقط
  function soleExpr(str) {
    var m = /^\s*\{\{([^}]*)\}\}\s*$/.exec(str || '');
    return m ? m[1] : null;
  }

  function hasExpr(str) {
    return str.indexOf('{{') !== -1;
  }

  function bindHover(el, baseStyle, hoverStyle) {
    el.addEventListener('mouseenter', function () {
      el.setAttribute('style', baseStyle + ';' + hoverStyle);
    });
    el.addEventListener('mouseleave', function () {
      el.setAttribute('style', baseStyle);
    });
  }

  function processNodes(nodes, scope, out) {
    for (var i = 0; i < nodes.length; i++) processNode(nodes[i], scope, out);
  }

  function processNode(node, scope, out) {
    if (node.nodeType === 3) {
      var txt = node.nodeValue;
      out.appendChild(document.createTextNode(hasExpr(txt) ? interp(txt, scope) : txt));
      return;
    }
    if (node.nodeType !== 1) return;

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = resolve(soleExpr(node.getAttribute('list')), scope) || [];
      var as = node.getAttribute('as');
      for (var k = 0; k < list.length; k++) {
        var inner = Object.create(scope);
        inner[as] = list[k];
        processNodes(node.childNodes, inner, out);
      }
      return;
    }

    if (tag === 'sc-if') {
      if (resolve(soleExpr(node.getAttribute('value')), scope)) {
        processNodes(node.childNodes, scope, out);
      }
      return;
    }

    var el = document.createElement(tag);
    var hoverStyle = null;

    for (var a = 0; a < node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var value = node.attributes[a].value;

      if (name.indexOf('hint-') === 0) continue;
      if (name === 'style-hover') { hoverStyle = value; continue; }
      if (name === 'onclick') {
        var fn = resolve(soleExpr(value), scope);
        if (typeof fn === 'function') el.addEventListener('click', fn);
        continue;
      }
      el.setAttribute(name, hasExpr(value) ? interp(value, scope) : value);
    }

    if (hoverStyle) bindHover(el, el.getAttribute('style') || '', hoverStyle);

    processNodes(node.childNodes, scope, el);
    out.appendChild(el);
  }

  function render(app) {
    var vals = app.renderVals();
    var frag = document.createDocumentFragment();
    processNodes(TPL.content.childNodes, vals, frag);
    ROOT.textContent = '';
    ROOT.appendChild(frag);
    document.documentElement.setAttribute('dir', vals.dir);
    document.documentElement.setAttribute('lang', vals.lang);
  }

  window.DCLogic = function () {};
  window.DCLogic.prototype.setState = function (patch) {
    var next = (typeof patch === 'function') ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, next);
    render(this);
    if (this.componentDidUpdate) this.componentDidUpdate();
  };

  window.__mount = function (Component) {
    TPL = document.getElementById('tpl');
    ROOT = document.getElementById('app');
    var app = new Component();
    render(app);
    if (app.componentDidMount) app.componentDidMount();
  };
})();

const DATA = { ar: AR, fr: FR, en: EN };

class Component extends DCLogic {
  state = { lang: null, open: null };

  componentDidMount() {
    try {
      const saved = localStorage.getItem('mas_lang');
      if (saved && DATA[saved]) this.setState({ lang: saved });
    } catch (e) {}
    this.reveal();
    this.parallax();
  }

  componentDidUpdate() { this.reveal(); }

  parallax() {
    if (this._px) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this._px = true;
    let raf = null;
    const tick = () => {
      raf = null;
      const vh = window.innerHeight;
      document.querySelectorAll('[data-px]').forEach((el) => {
        const r = el.getBoundingClientRect();
        const mid = r.top + r.height / 2 - vh / 2;
        el.style.transform = 'translate3d(0,' + (-mid * parseFloat(el.dataset.px)).toFixed(1) + 'px,0)';
      });
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(tick); };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    tick();
  }

  reveal() {
    const nodes = Array.from(document.querySelectorAll('[data-rv]'));
    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };
    if (!('IntersectionObserver' in window)) { nodes.forEach(show); return; }
    if (!this._io) {
      this._io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { show(e.target); this._io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 });
      setTimeout(() => nodes.forEach(show), 2600);
    }
    nodes.forEach((el) => {
      if (el.dataset.rvInit) return;
      el.dataset.rvInit = '1';
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1)';
      this._io.observe(el);
    });
  }

  set(lang) {
    try { localStorage.setItem('mas_lang', lang); } catch (e) {}
    this.setState({ lang: lang, open: null });
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'auto' });
  }

  renderVals() {
    const lang = this.state.lang || 'ar';
    const t = DATA[lang];
    const faqs = t.faqs.map((f, i) => ({
      q: f.q,
      a: f.a,
      open: this.state.open === i,
      sign: this.state.open === i ? '−' : '+',
      toggle: () => this.setState((s) => ({ open: s.open === i ? null : i }))
    }));
    return {
      lang: lang,
      dir: lang === 'ar' ? 'rtl' : 'ltr',
      t: t,
      faqs: faqs,
      showGate: !this.state.lang,
      pickAr: () => this.set('ar'),
      pickFr: () => this.set('fr'),
      pickEn: () => this.set('en'),
      waLink: 'https://wa.me/22224555506',
      mailLink: 'mailto:mouhamedabselam25@gmail.com',
      liLink: 'https://www.linkedin.com/in/mouhamed-abdselam-415879424'
    };
  }
}
